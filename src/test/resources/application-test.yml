spring:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

management:
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
  tracing:
    sampling:
      probability: 0.0

sentry:
  dsn:
  enabled: false

timefold:
  solver:
    termination:
      spent-limit: 1s
