spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/vrp
    username: vrp
    password: vrp
  data:
    redis:
      host: localhost
      port: 6379
  temporal:
    connection:
      target: localhost:7233
    namespace: vrp
    workers:
      - task-queue: vrp-solver
        name: vrp-worker
        workflow-classes:
          - com.example.vrp.workflow.VrpSolveWorkflowImpl
        activity-beans:
          - fetchOrdersActivityImpl
          - fetchVehiclesActivityImpl
          - runSolverActivityImpl
          - persistSolutionActivityImpl
          - updateJobStatusActivityImpl
          - emitAuditActivityImpl

management:
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  tracing:
    sampling:
      probability: 1.0
